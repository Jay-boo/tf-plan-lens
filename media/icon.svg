<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#141722"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="112" cy="116" r="62"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- The plan's bar strip: one bar per change, the riskier the taller (destroy, replace, update, create). -->
  <g opacity="0.38">
    <rect x="44" y="96" width="18" height="96" rx="4" fill="#f85149"/>
    <rect x="70" y="112" width="18" height="80" rx="4" fill="#f0883e"/>
    <rect x="96" y="132" width="18" height="60" rx="4" fill="#d29922"/>
    <rect x="122" y="132" width="18" height="60" rx="4" fill="#d29922"/>
    <rect x="148" y="148" width="18" height="44" rx="4" fill="#3fb950"/>
    <rect x="174" y="148" width="18" height="44" rx="4" fill="#3fb950"/>
  </g>
  <!-- Under the lens, sharp and bright. -->
  <g clip-path="url(#lens)">
    <rect x="44" y="96" width="18" height="96" rx="4" fill="#ff6b61"/>
    <rect x="70" y="112" width="18" height="80" rx="4" fill="#ffa057"/>
    <rect x="96" y="132" width="18" height="60" rx="4" fill="#f2c14e"/>
    <rect x="122" y="132" width="18" height="60" rx="4" fill="#f2c14e"/>
    <rect x="148" y="148" width="18" height="44" rx="4" fill="#4fd36a"/>
    <circle cx="112" cy="116" r="62" fill="url(#glass)"/>
  </g>
  <circle cx="112" cy="116" r="62" fill="none" stroke="#e8ecf6" stroke-width="12"/>
  <path d="M157 161 L204 208" stroke="#e8ecf6" stroke-width="22" stroke-linecap="round"/>
</svg>
