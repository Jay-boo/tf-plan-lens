name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux only for now: the unit tests are written with POSIX paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node esbuild.mjs --production
